<!DOCTYPE html>
<html lang="ru" data-theme="violet">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0912" id="metaTheme" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BookLife" />
  <title>BookLife</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..600&family=Onest:wght@400;500;600;700&display=swap&subset=cyrillic" rel="stylesheet" />
  <script>
    // Тема применяется до отрисовки, чтобы не было вспышки
    try {
      var s = JSON.parse(localStorage.getItem('reader.settings.v3') || '{}');
      if (s.theme) document.documentElement.dataset.theme = s.theme;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <!-- Боковая панель (ПК) -->
    <aside class="rail" id="rail">
      <a class="brand" href="#/">
        <svg class="logo" viewBox="0 0 48 40" aria-hidden="true"><defs><linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a98bff"/><stop offset="1" stop-color="#6a45e8"/></linearGradient></defs><path d="M2 5l18 4v28L2 33z" fill="url(#lg1)"/><path d="M46 5L28 9v28l18-4z" fill="url(#lg1)" opacity=".85"/><path d="M22 9.5h4V38h-4z" fill="url(#lg1)"/></svg>
        <span class="brand-name">Book<i>Life</i></span>
      </a>

      <nav class="nav">
        <a data-nav="home" href="#/"><i data-icon="home"></i>Главная</a>
        <a data-nav="search" href="#/search/"><i data-icon="compass"></i>Открыть</a>
        <a data-nav="shelf" href="#/shelf"><i data-icon="books"></i>Библиотека</a>
        <a data-nav="fav" href="#/fav"><i data-icon="heart"></i>Избранное</a>
        <a data-nav="profile" href="#/profile"><i data-icon="user"></i>Профиль</a>
      </nav>

      <div class="rail-title">Жанры</div>
      <div class="genres" id="genres">
        <div class="skel-line"></div>
        <div class="skel-line"></div>
        <div class="skel-line"></div>
      </div>

      <button class="rail-foot" type="button" data-open-settings>
        <span class="aa">Aa</span> Оформление
      </button>
    </aside>

    <main class="main">
      <header class="topbar" id="topbar">
        <div class="mhead">
          <a class="mbrand" href="#/" aria-label="BookLife, на главную">
            <svg class="logo" viewBox="0 0 48 40" aria-hidden="true"><defs><linearGradient id="lg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a98bff"/><stop offset="1" stop-color="#6a45e8"/></linearGradient></defs><path d="M2 5l18 4v28L2 33z" fill="url(#lg2)"/><path d="M46 5L28 9v28l18-4z" fill="url(#lg2)" opacity=".85"/><path d="M22 9.5h4V38h-4z" fill="url(#lg2)"/></svg>
            <span><b>Book<i>Life</i></b><small>Читай. Развивайся. Живи лучше.</small></span>
          </a>
          <button class="ibtn aa" type="button" data-open-settings aria-label="Оформление">Aa</button>
        </div>
        <div class="srow">
          <form class="search" id="searchForm" autocomplete="off" role="search">
            <i data-icon="search"></i>
            <input id="searchInput" type="search" enterkeyhint="search" placeholder="Поиск книг, авторов…" aria-label="Поиск книг" />
            <button type="submit" class="search-go">Найти</button>
          </form>
          <a class="ibtn filt" href="#/search/" aria-label="Все жанры"><i data-icon="filter"></i></a>
        </div>
      </header>

      <section class="content" id="content"></section>
    </main>
  </div>

  <!-- Нижняя навигация (телефон) -->
  <nav class="tabbar" id="tabbar" aria-label="Разделы">
    <a data-nav="home" href="#/"><i data-icon="home"></i><span>Главная</span></a>
    <a data-nav="shelf" href="#/shelf"><i data-icon="books"></i><span>Библиотека</span></a>
    <a data-nav="search" href="#/search/"><i data-icon="compass"></i><span>Открыть</span></a>
    <a data-nav="fav" href="#/fav"><i data-icon="heart"></i><span>Избранное</span></a>
    <a data-nav="profile" href="#/profile"><i data-icon="user"></i><span>Профиль</span></a>
  </nav>

  <div id="sheetRoot"></div>

  <script src="/app.js"></script>
</body>
</html>
